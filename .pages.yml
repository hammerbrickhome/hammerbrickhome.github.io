# Hammer Brick & Home LLC — Admin V3 Control Center
# Public website content only. Do not place private customer/job/payment data here.

media:
  - name: project_images
    label: Project Photos
    input: images
    output: /images
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe
    commit:
      templates:
        create: "media: upload {filename}"
        update: "media: update {filename}"
        delete: "media: delete {filename}"
        rename: "media: rename {oldFilename} to {newFilename}"

settings:
  commit:
    identity: app
    templates:
      update: "admin: update {path}"

content:
  - name: homepage_control
    label: "01 — Homepage Control"
    type: file
    path: site-data/homepage.json
    format: json
    fields:
      - name: announcementEnabled
        label: "Show Announcement Bar"
        type: boolean
        default: false
      - name: announcementText
        label: "Announcement Text"
        type: string
      - name: announcementButtonText
        label: "Announcement Button"
        type: string
        required: false
      - name: announcementButtonUrl
        label: "Announcement Button Link"
        type: string
        required: false

      - name: heroTitle
        label: "Homepage Main Headline"
        type: string
        required: true
      - name: heroText
        label: "Homepage Intro"
        type: text
        required: true
      - name: heroPrimaryButtonText
        label: "Primary Button Text"
        type: string
      - name: heroSecondaryButtonText
        label: "Secondary Button Text"
        type: string
      - name: trustPills
        label: "Trust Badges"
        type: string
        list: true

      - name: showPremiumMaterials
        label: "Show Premium Materials"
        type: boolean
        default: true
      - name: premiumMaterials
        label: "Premium Material Brands"
        type: string
        list: true

      - name: showSpecials
        label: "Show Monthly Specials"
        type: boolean
        default: true
      - name: showTiers
        label: "Show Estimate Tiers"
        type: boolean
        default: true
      - name: showMembershipServices
        label: "Show Membership + Signature Services"
        type: boolean
        default: true
      - name: showProcess
        label: "Show How We Work"
        type: boolean
        default: true
      - name: showBeforeAfter
        label: "Show Before & After"
        type: boolean
        default: true
      - name: showGuarantee
        label: "Show Guarantee / Why Choose Us"
        type: boolean
        default: true
      - name: showReviews
        label: "Show Reviews"
        type: boolean
        default: true
      - name: showServiceArea
        label: "Show Service Area"
        type: boolean
        default: true
      - name: showFaq
        label: "Show Common Questions"
        type: boolean
        default: true

      - name: tierHeading
        label: "Estimate Tier Heading"
        type: string
      - name: tierText
        label: "Estimate Tier Intro"
        type: text
      - name: processHeading
        label: "How We Work Heading"
        type: string
      - name: beforeAfterHeading
        label: "Before & After Heading"
        type: string
      - name: beforeAfterNote
        label: "Before & After Note"
        type: string

      - name: guaranteeTitle
        label: "Guarantee Title"
        type: string
      - name: guaranteeText
        label: "Guarantee Message"
        type: text
      - name: guaranteeSignature
        label: "Guarantee Signature"
        type: string
      - name: whyNeighborsTitle
        label: "Why Choose Us Heading"
        type: string
      - name: whyNeighborsText
        label: "Why Choose Us Text"
        type: text

      - name: serviceAreaHeading
        label: "Service Area Heading"
        type: string
      - name: serviceAreaIntro
        label: "Service Area Intro"
        type: text

  - name: business_settings
    label: "02 — Business Settings"
    type: file
    path: site-data/business.json
    format: json
    fields:
      - name: businessName
        label: "Business Name"
        type: string
      - name: phone
        label: "Public Phone"
        type: string
      - name: email
        label: "Public Email"
        type: string
      - name: website
        label: "Website"
        type: string
      - name: nycHic
        label: "NYC HIC Number"
        type: string
      - name: njHic
        label: "NJ HIC Number"
        type: string
      - name: epaLabel
        label: "EPA / Credential Wording"
        type: string
      - name: headerTagline
        label: "Header Credential Line"
        type: text
      - name: serviceAreas
        label: "Service Areas"
        type: string
        list: true
      - name: facebook
        label: "Facebook URL"
        type: string
        required: false
      - name: instagram
        label: "Instagram URL"
        type: string
        required: false
      - name: youtube
        label: "YouTube URL"
        type: string
        required: false
      - name: googleReviewsUrl
        label: "Google Review / Reviews URL"
        type: string
        required: false

  - name: monthly_specials
    label: "03 — Monthly Service Specials"
    type: file
    path: site-data/specials.json
    format: json
    fields:
      - name: heading
        label: "Section Heading"
        type: string
      - name: subheading
        label: "Section Description"
        type: text
      - name: finePrint
        label: "Fine Print"
        type: text
      - name: specials
        label: "Special Offers"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {price}"
        fields:
          - name: active
            label: "Active"
            type: boolean
            default: true
          - name: startDate
            label: "Start Date (optional)"
            type: string
            required: false
            description: "YYYY-MM-DD. Leave blank to start immediately."
          - name: endDate
            label: "End Date (optional)"
            type: string
            required: false
            description: "YYYY-MM-DD. Leave blank for no expiration."
          - name: badge
            label: "Badge"
            type: string
            required: false
          - name: accentColor
            label: "Accent Color"
            type: string
          - name: badgeTextColor
            label: "Badge Text Color"
            type: string
          - name: title
            label: "Special Name"
            type: string
            required: true
          - name: price
            label: "Displayed Price"
            type: string
            required: true
          - name: description
            label: "Description"
            type: text
          - name: features
            label: "What's Included"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{text}"
            fields:
              - name: text
                label: "Item"
                type: string
              - name: bold
                label: "Emphasize"
                type: boolean
                default: false
          - name: addons
            label: "Popular Add-Ons"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name} — {price}"
            fields:
              - name: name
                label: "Add-On"
                type: string
              - name: price
                label: "Price"
                type: string
          - name: requirements
            label: "Client Requirements / Protection Clause"
            type: text
          - name: buttonText
            label: "Button Text"
            type: string

  - name: customer_reviews
    label: "04 — Customer Reviews"
    type: file
    path: site-data/reviews.json
    format: json
    fields:
      - name: eyebrow
        label: "Small Heading"
        type: string
      - name: heading
        label: "Main Heading"
        type: string
      - name: reviewUrl
        label: "Google Reviews Button URL"
        type: string
        required: false
      - name: reviews
        label: "Reviews"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {service}"
        fields:
          - name: active
            label: "Show on Website"
            type: boolean
            default: true
          - name: name
            label: "Customer Name"
            type: string
            required: true
          - name: rating
            label: "Stars"
            type: number
            default: 5
            options:
              min: 1
              max: 5
          - name: source
            label: "Source"
            type: select
            options:
              values:
                - Google Review
                - Yelp Review
                - Facebook Review
                - Customer Review
          - name: review
            label: "Review"
            type: text
            required: true
          - name: service
            label: "Service / Project"
            type: string
            required: false

  - name: common_questions
    label: "05 — Common Questions"
    type: file
    path: site-data/faqs.json
    format: json
    fields:
      - name: heading
        label: "Section Heading"
        type: string
      - name: items
        label: "Questions & Answers"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: active
            label: "Show on Website"
            type: boolean
            default: true
          - name: question
            label: "Question"
            type: string
            required: true
          - name: answer
            label: "Answer"
            type: text
            required: true

  - name: gallery
    label: "06 — Project Gallery Manager"
    type: file
    path: gallery.json
    format: json
    fields:
      - name: homePairs
        label: "Homepage Before & After"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label} — #{index}"
        fields:
          - name: before
            label: "Before Photo"
            type: image
            required: false
            options:
              media: project_images
          - name: after
            label: "After Photo"
            type: image
            required: false
            options:
              media: project_images
          - name: label
            label: "Project Title"
            type: string
            required: true
          - name: tags
            label: "Tags"
            type: string
            list: true
            required: false

      - name: galleryPairs
        label: "Full Gallery Before & After"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label} — #{index}"
        fields:
          - name: before
            label: "Before Photo"
            type: image
            required: false
            options:
              media: project_images
          - name: after
            label: "After Photo"
            type: image
            required: false
            options:
              media: project_images
          - name: label
            label: "Project Title"
            type: string
            required: true
          - name: tags
            label: "Tags"
            type: string
            list: true
            required: false

      - name: galleryGrid
        label: "Gallery Photo Grid"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Photo #{index}"
        fields:
          - name: name
            label: "Photo"
            type: image
            required: true
            options:
              media: project_images
          - name: tags
            label: "Tags"
            type: string
            list: true
            required: false

  - name: unused_images_report
    label: "07 — Unused Images Report"
    type: file
    path: admin-tools/unused-images-report.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: generatedAt
        label: "Last Scan"
        type: string
      - name: count
        label: "Unused Images Found"
        type: number
      - name: totalSize
        label: "Potential Space To Free"
        type: string
      - name: note
        label: "Safety Note"
        type: text
      - name: files
        label: "Review These Images"
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{image} — {size}"
        fields:
          - name: image
            label: "Image"
            type: image
            options:
              media: project_images
          - name: size
            label: "File Size"
            type: string
          - name: reason
            label: "Why It Is Listed"
            type: text

  - name: site_health_report
    label: "08 — Admin Health Report"
    type: file
    path: admin-tools/site-health-report.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: generatedAt
        label: "Last Check"
        type: string
      - name: status
        label: "Overall Status"
        type: string
      - name: summary
        label: "Summary"
        type: text
      - name: checks
        label: "Checks"
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{status} — {name}"
        fields:
          - name: name
            label: "Check"
            type: string
          - name: status
            label: "Status"
            type: string
          - name: details
            label: "Details"
            type: text

actions:
  - name: run-admin-health-check
    label: "Run Admin Health Check"
    workflow: hammer-admin-health.yml
    ref: current
    cancelable: false
    confirm:
      title: "Run website admin health check?"
      message: "Checks the CMS setup, gallery image references and repository housekeeping. It does not scan the hidden Services links."
      button: "Run Health Check"

  - name: scan-unused-gallery-images
    label: "Scan Unused Images"
    workflow: gallery-image-cleanup.yml
    ref: current
    cancelable: false
    confirm:
      title: "Scan for unused images?"
      message: "This only creates a report. It does not delete any images."
      button: "Run Scan"

  - name: delete-verified-unused-images
    label: "Delete Verified Unused Images"
    workflow: gallery-image-cleanup.yml
    ref: current
    cancelable: false
    confirm:
      title: "Delete reviewed unused images?"
      message: "Only images from the latest scan report that are STILL unused will be deleted."
      button: "Delete Verified Images"
