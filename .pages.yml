# Hammer Brick & Home LLC — MASTER ADMIN SAFE
# Built around the current working GitHub site.
# Uploading this config does NOT replace index.html, style.css or script.js.

media:
  - name: project_images
    label: "Project Photos"
    input: images
    output: /images
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

settings:
  commit:
    identity: app
    templates:
      create: "admin: create {path}"
      update: "admin: update {path}"
      delete: "admin: delete {path}"

content:

  - name: website
    label: "🏠 Website"
    type: group
    items:

      - name: homepage
        label: "Homepage Content"
        type: file
        path: site-data/homepage.json
        format: json
        fields:
          - {name: announcementEnabled, label: "Show Announcement", type: boolean, required: false}
          - {name: announcementText, label: "Announcement Text", type: string, required: false}
          - {name: announcementButtonText, label: "Announcement Button", type: string, required: false}
          - {name: announcementButtonUrl, label: "Announcement Link", type: string, required: false}
          - {name: heroTitle, label: "Hero Headline", type: string}
          - {name: heroText, label: "Hero Intro", type: text}
          - {name: heroPrimaryButtonText, label: "Primary Button", type: string}
          - {name: heroSecondaryButtonText, label: "Secondary Button", type: string}
          - {name: trustPills, label: "Trust Messages", type: string, list: true, required: false}
          - {name: showPremiumMaterials, label: "Show Premium Materials", type: boolean, required: false}
          - {name: premiumMaterials, label: "Premium Materials", type: string, list: true}
          - {name: showSpecials, label: "Show Specials", type: boolean, required: false}
          - {name: showTiers, label: "Show Estimate Tiers", type: boolean, required: false}
          - {name: showMembershipServices, label: "Show Membership Services", type: boolean, required: false}
          - {name: showProcess, label: "Show Process", type: boolean, required: false}
          - {name: showBeforeAfter, label: "Show Before & After", type: boolean, required: false}
          - {name: showGuarantee, label: "Show Guarantee", type: boolean, required: false}
          - {name: showReviews, label: "Show Reviews", type: boolean, required: false}
          - {name: showServiceArea, label: "Show Service Area", type: boolean, required: false}
          - {name: showFaq, label: "Show FAQs", type: boolean, required: false}
          - {name: tierHeading, label: "Tier Heading", type: string, required: false}
          - {name: tierText, label: "Tier Introduction", type: text, required: false}
          - {name: processHeading, label: "Process Heading", type: string, required: false}
          - {name: beforeAfterHeading, label: "Before & After Heading", type: string, required: false}
          - {name: beforeAfterNote, label: "Before & After Note", type: text, required: false}
          - {name: guaranteeTitle, label: "Guarantee Title", type: string, required: false}
          - {name: guaranteeText, label: "Guarantee Text", type: text, required: false}
          - {name: guaranteeSignature, label: "Guarantee Signature", type: string, required: false}
          - {name: whyNeighborsTitle, label: "Why Neighbors Title", type: string, required: false}
          - {name: whyNeighborsText, label: "Why Neighbors Text", type: text, required: false}
          - {name: reviewEyebrow, label: "Review Eyebrow", type: string}
          - {name: reviewHeading, label: "Review Heading", type: string}
          - {name: reviewIntro, label: "Review Intro", type: text}
          - {name: reviewButtonText, label: "Review Button", type: string}
          - {name: faqHeading, label: "FAQ Heading", type: string}
          - {name: serviceAreaHeading, label: "Service Area Heading", type: string}
          - {name: serviceAreaIntro, label: "Service Area Intro", type: text}

      - name: business
        label: "Business Settings"
        type: file
        path: site-data/business.json
        format: json
        fields:
          - {name: businessName, label: "Business Name", type: string}
          - {name: phone, label: "Public Phone", type: string}
          - {name: email, label: "Public Email", type: string}
          - {name: website, label: "Website", type: string}
          - {name: nycHic, label: "NYC HIC", type: string}
          - {name: njHic, label: "NJ HIC", type: string}
          - {name: epaLabel, label: "EPA Wording", type: string}
          - {name: headerTagline, label: "Header Tagline", type: text, required: false}
          - {name: serviceAreas, label: "Service Areas", type: string, list: true}
          - {name: facebook, label: "Facebook", type: string, required: false}
          - {name: instagram, label: "Instagram", type: string, required: false}
          - {name: youtube, label: "YouTube", type: string, required: false}
          - {name: googleReviewsUrl, label: "Google Reviews URL", type: string, required: false}

  - name: marketing
    label: "📣 Marketing"
    type: group
    items:

      - name: specials
        label: "Monthly Specials"
        type: file
        path: site-data/specials.json
        format: json
        fields:
          - {name: heading, label: "Heading", type: string}
          - {name: subheading, label: "Intro", type: text}
          - {name: finePrint, label: "Fine Print", type: text}
          - name: specials
            label: "Specials"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} — {price}"
            fields:
              - {name: active, label: "Active", type: boolean}
              - {name: badge, label: "Badge", type: string}
              - {name: accentColor, label: "Accent Color", type: string}
              - {name: badgeTextColor, label: "Badge Text Color", type: string, required: false}
              - {name: startDate, label: "Start Date (YYYY-MM-DD)", type: string, required: false}
              - {name: endDate, label: "End Date (YYYY-MM-DD)", type: string, required: false}
              - {name: title, label: "Title", type: string}
              - {name: price, label: "Price", type: string}
              - {name: description, label: "Description", type: text}
              - name: features
                label: "Included Work"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{text}"
                fields:
                  - {name: text, label: "Item", type: string}
                  - {name: bold, label: "Bold", type: boolean, required: false}
              - name: addons
                label: "Add-Ons"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name} — {price}"
                fields:
                  - {name: name, label: "Add-On", type: string}
                  - {name: price, label: "Price", type: string}
              - {name: requirements, label: "Requirements", type: text}
              - {name: buttonText, label: "Button Text", type: string}

      - name: reviews
        label: "Customer Reviews"
        type: file
        path: site-data/reviews.json
        format: json
        fields:
          - {name: eyebrow, label: "Review Eyebrow", type: string, required: false}
          - {name: heading, label: "Review Heading", type: string, required: false}
          - {name: reviewUrl, label: "Google Reviews URL", type: string}
          - name: reviews
            label: "Reviews"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name} — {service}"
            fields:
              - {name: active, label: "Show", type: boolean}
              - {name: name, label: "Customer Name", type: string}
              - {name: rating, label: "Stars", type: number}
              - {name: source, label: "Source", type: string}
              - {name: review, label: "Review", type: text}
              - {name: service, label: "Service", type: string}

      - name: faqs
        label: "Common Questions"
        type: file
        path: site-data/faqs.json
        format: json
        fields:
          - {name: heading, label: "FAQ Heading", type: string, required: false}
          - name: items
            label: "Questions"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{question}"
            fields:
              - {name: active, label: "Show", type: boolean}
              - {name: question, label: "Question", type: string}
              - {name: answer, label: "Answer", type: text}

  - name: projects
    label: "🧱 Projects & Media"
    type: group
    items:

      - name: gallery
        label: "Project Gallery Manager"
        type: file
        path: gallery.json
        format: json
        fields:
          - name: homePairs
            label: "Homepage Before & After"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label} — #{index}"
            fields:
              - {name: before, label: "Before Photo", type: image, required: false, options: {media: project_images}}
              - {name: after, label: "After Photo", type: image, required: false, options: {media: project_images}}
              - {name: label, label: "Project Title", type: string}
              - {name: tags, label: "Tags", type: string, list: true, required: false}

          - name: galleryPairs
            label: "Full Gallery Before & After"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label} — #{index}"
            fields:
              - {name: before, label: "Before Photo", type: image, required: false, options: {media: project_images}}
              - {name: after, label: "After Photo", type: image, required: false, options: {media: project_images}}
              - {name: label, label: "Project Title", type: string}
              - {name: tags, label: "Tags", type: string, list: true, required: false}

          - name: galleryGrid
            label: "Gallery Photo Grid"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Photo #{index}"
            fields:
              - {name: name, label: "Photo", type: image, options: {media: project_images}}
              - {name: tags, label: "Tags", type: string, list: true, required: false}

      - name: project_stories
        label: "Project Stories — Draft Manager"
        type: collection
        path: content/projects
        format: json
        exclude: ["_template.json"]
        filename: "{fields.slug}.json"
        view:
          primary: title
          fields: [published, featured, service, location]
        fields:
          - {name: title, label: "Project Title", type: string}
          - {name: slug, label: "URL Slug", type: string}
          - {name: published, label: "Published", type: boolean}
          - {name: featured, label: "Featured", type: boolean}
          - {name: service, label: "Service", type: string}
          - {name: location, label: "Location", type: string}
          - {name: neighborhood, label: "Neighborhood", type: string, required: false}
          - {name: beforeImage, label: "Before Photo", type: image, required: false, options: {media: project_images}}
          - {name: afterImage, label: "After Photo", type: image, required: false, options: {media: project_images}}
          - {name: additionalImages, label: "Additional Photos", type: image, list: true, required: false, options: {media: project_images}}
          - {name: summary, label: "Summary", type: text}
          - {name: problem, label: "Problem", type: text}
          - {name: solution, label: "What We Did", type: text}
          - {name: materials, label: "Materials", type: string, list: true, required: false}
          - {name: timeline, label: "Timeline", type: string, required: false}
          - {name: seoTitle, label: "SEO Title", type: string, required: false}
          - {name: seoDescription, label: "SEO Description", type: text, required: false}

  - name: estimator
    label: "🧮 Estimator"
    type: group
    items:
      - name: estimator_factors
        label: "Estimator Factors"
        type: file
        path: admin-data/estimator.json
        format: json
        fields:
          - {name: note, label: "Safety Note", type: text, readonly: true}
          - name: boroughFactors
            label: "Borough Factors"
            type: object
            fields:
              - {name: staten-island, label: "Staten Island", type: number}
              - {name: brooklyn, label: "Brooklyn", type: number}
              - {name: queens, label: "Queens", type: number}
              - {name: bronx, label: "Bronx", type: number}
              - {name: manhattan, label: "Manhattan", type: number}
              - {name: nj, label: "New Jersey", type: number}
              - {name: outside, label: "Outside", type: number}
          - name: finishFactors
            label: "Finish Factors"
            type: object
            fields:
              - {name: standard, label: "Standard", type: number}
              - {name: premium, label: "Premium", type: number}
              - {name: luxury, label: "Luxury", type: number}
          - name: urgencyFactors
            label: "Urgency Factors"
            type: object
            fields:
              - {name: flex, label: "Flexible", type: number}
              - {name: soon, label: "Soon", type: number}
              - {name: rush, label: "Rush", type: number}

  - name: seo_drafts
    label: "📚 Pages & SEO Drafts"
    type: group
    items:

      - name: service_pages
        label: "Service Page Drafts"
        type: collection
        path: content/services
        format: json
        filename: "{fields.slug}.json"
        view:
          primary: title
          fields: [published]
        fields:
          - {name: title, label: "Title", type: string}
          - {name: slug, label: "Slug", type: string}
          - {name: published, label: "Published", type: boolean}
          - {name: summary, label: "Summary", type: text}
          - {name: heroImage, label: "Hero Image", type: image, required: false, options: {media: project_images}}
          - {name: body, label: "Body", type: rich-text, options: {format: markdown, media: project_images}}
          - {name: seoTitle, label: "SEO Title", type: string, required: false}
          - {name: seoDescription, label: "SEO Description", type: text, required: false}

      - name: area_pages
        label: "Service Area Drafts"
        type: collection
        path: content/areas
        format: json
        filename: "{fields.slug}.json"
        view:
          primary: title
          fields: [published]
        fields:
          - {name: title, label: "Area", type: string}
          - {name: slug, label: "Slug", type: string}
          - {name: published, label: "Published", type: boolean}
          - {name: intro, label: "Intro", type: text}
          - {name: neighborhoods, label: "Neighborhoods / Towns", type: string, list: true}
          - {name: featuredServices, label: "Featured Services", type: string, list: true}
          - {name: body, label: "Body", type: rich-text, options: {format: markdown, media: false}}
          - {name: seoTitle, label: "SEO Title", type: string, required: false}
          - {name: seoDescription, label: "SEO Description", type: text, required: false}

      - name: resources
        label: "Resource / Advice Drafts"
        type: collection
        path: content/resources
        format: json
        filename: "{fields.slug}.json"
        view:
          primary: title
          fields: [published, category]
        fields:
          - {name: title, label: "Title", type: string}
          - {name: slug, label: "Slug", type: string}
          - {name: published, label: "Published", type: boolean}
          - {name: category, label: "Category", type: string}
          - {name: summary, label: "Summary", type: text}
          - {name: body, label: "Body", type: rich-text, options: {format: markdown, media: project_images}}
          - {name: seoTitle, label: "SEO Title", type: string, required: false}
          - {name: seoDescription, label: "SEO Description", type: text, required: false}

  - name: health
    label: "⚙️ Site Health"
    type: group
    items:

      - name: master_audit
        label: "Master Site Audit"
        type: file
        path: admin-tools/master-audit.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - {name: generatedAt, label: "Last Run", type: string}
          - {name: status, label: "Status", type: string}
          - {name: summary, label: "Summary", type: text}
          - name: checks
            label: "Checks"
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{status} — {name}"
            fields:
              - {name: name, label: "Check", type: string}
              - {name: status, label: "Status", type: string}
              - {name: details, label: "Details", type: text}
              - {name: items, label: "Items", type: string, list: true, required: false}

      - name: unused_images_report
        label: "Unused Images Report"
        type: file
        path: admin-tools/unused-images-report.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - {name: generatedAt, label: "Last Scan", type: string}
          - {name: count, label: "Unused Images Found", type: number}
          - {name: totalSize, label: "Potential Space To Free", type: string}
          - {name: note, label: "Safety Note", type: text}
          - name: files
            label: "Review These Images"
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{image} — {size}"
            fields:
              - {name: image, label: "Image", type: image, options: {media: project_images}}
              - {name: size, label: "File Size", type: string}
              - {name: reason, label: "Why It Is Listed", type: text}

actions:
  - name: scan-unused-gallery-images
    label: "Scan Unused Images"
    workflow: gallery-image-cleanup.yml
    ref: current
    confirm:
      title: "Scan for unused images?"
      message: "Report only. Does not delete images."
      button: "Run Scan"

  - name: delete-verified-unused-images
    label: "Delete Verified Unused Images"
    workflow: gallery-image-cleanup.yml
    ref: current
    confirm:
      title: "Delete reviewed unused images?"
      message: "Only files still verified as unused by the existing cleanup workflow should be deleted."
      button: "Delete Verified Images"

