<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Design Preview | Hammer Brick &amp; Home</title><style>body{margin:0;font:16px/1.5 system-ui;background:#eae7df;color:#142638}header{padding:20px 28px;background:#102438;color:#fff}a{color:inherit}h1{font-family:Georgia,serif;margin:5px 0}p{max-width:900px}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:18px 28px;background:white}label{display:grid;gap:6px}select,button{font:inherit;padding:10px;border:1px solid #a3adb6;border-radius:6px;background:white;color:#102438}button{cursor:pointer}#frame{display:block;width:100%;height:850px;border:0;margin:auto;background:#fff}#status{padding:0 28px}main{padding:20px;overflow:auto}</style></head><body><header><a href="index.html">← Admin</a> · <a href="layout.html">Section controls</a><h1>Choose your next homepage</h1><p>Preview any of your 30 designs. Your saved website stays as it is. Download exports a homepage settings file; it does not publish.</p></header><nav><label>Design<select id="design"></select></label><label>Preview size<select id="size"><option value="100%">Desktop</option><option value="390px">Phone — 390px</option><option value="768px">Tablet — 768px</option></select></label><button id="download" disabled>Download selected homepage settings</button></nav><p id="status" role="status">Loading current settings…</p><main><iframe id="frame" title="Homepage design preview"></iframe></main><script>
const choices=[['classic','1 — Original Classic'],['luxury','2 — Pomegranate Prestige'],['leads','3 — Executive Trust'],['portfolio','4 — Project Gallery'],['local','5 — Cream, Green & Brick'],['americana','6 — Fourth of July'],['winter','7 — Winter Midnight'],['spring','8 — Spring Renewal'],['summer','9 — Summer Coast'],['autumn','10 — Autumn Hearth'],['holiday','11 — Holiday Evergreen'],['blueprint','12 — NYC Blueprint'],['monochrome','13 — Architectural Monochrome'],['terracotta','14 — Terracotta Studio'],['royal','15 — Royal Estate'],['ivory-estate','16 — White Architectural Estate'],['gold-noir','17 — Master Craftsman Gold'],['skyline-night','18 — NYC Skyline Night'],['brownstone-craft','19 — Brownstone Heritage'],['garden-estate','20 — Garden Residence'],['stone-gallery','21 — Limestone Gallery'],['copper-workshop','22 — Copper Workshop'],['coastal-house','23 — Coastal House'],['architect-paper','24 — Architect Paper'],['emerald-signature','25 — Emerald Signature'],["ivory-panorama", "26 — White Buildings — Full Page"],["gold-panorama", "27 — Gold Buildings — Full Page"],["champagne-panorama", "28 — Champagne Avenue — Full Page"],["sapphire-panorama", "29 — Sapphire City — Full Page"],["olive-panorama", "30 — Olive & Limestone — Full Page"]];
const select=document.getElementById('design'),frame=document.getElementById('frame'),status=document.getElementById('status');let original;
choices.forEach(([key,name])=>{const o=document.createElement('option');o.value=key;o.textContent=name;select.append(o);});
function preview(){frame.src='/?designPreview='+encodeURIComponent(select.value);}
select.onchange=preview;document.getElementById('size').onchange=e=>frame.style.width=e.target.value;
fetch('../site-data/homepage.json').then(r=>{if(!r.ok)throw Error();return r.json();}).then(d=>{original=d;select.value=d.homepageLayout||'classic';preview();document.getElementById('download').disabled=false;status.textContent='Preview only. Decorative building images are concept artwork, not completed project photos.';}).catch(()=>{preview();status.textContent='Open this preview through your website or a local web server. Settings could not be loaded, so download is disabled.';});
document.getElementById('download').onclick=()=>{if(!original)return;const data={...original,homepageLayout:select.value};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='homepage.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='Downloaded. Replace site-data/homepage.json only when ready. Your existing section settings were kept.';};
</script></body></html>
