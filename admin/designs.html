const select=document.getElementById('design'),frame=document.getElementById('frame'),status=document.getElementById('status');let original;
choices.forEach(([key,name])=>{const o=document.createElement('option');o.value=key;o.textContent=name;select.append(o);});
function preview(){frame.src='/?designPreview='+encodeURIComponent(select.value);}
document.querySelectorAll('[data-design]').forEach(button=>button.onclick=()=>{select.value=button.dataset.design;preview();frame.scrollIntoView({behavior:'smooth',block:'start'});});
select.onchange=preview;document.getElementById('size').onchange=e=>frame.style.width=e.target.value;
fetch('../site-data/homepage.json').then(r=>{if(!r.ok)throw Error();return r.json();}).then(d=>{original=d;select.value=d.homepageLayout||'classic';preview();document.getElementById('download').disabled=false;status.textContent='Preview only. Designs 1–17 are preserved. Designs 18–30 use original concept artwork, not completed project photos.';}).catch(()=>{preview();status.textContent='Open this preview through your website or a local web server. Settings could not be loaded, so download is disabled.';});
