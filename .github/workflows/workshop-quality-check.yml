name: Workshop Quality Check (manual, no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only browser tools
        run: |
          python -m pip install PyYAML==6.0.3
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Inspect local website
        id: inspect
        continue-on-error: true
        run: python scripts/workshop_check.py --root . --output workshop-test-results/release-report.json
      - name: Capture six layouts
        id: visual
        continue-on-error: true
        run: node scripts/workshop_visual.cjs --root . --output workshop-test-results
      - name: Downloadable report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HammerBrick-Workshop-Test-Results
          path: workshop-test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Report a failed check
        if: steps.inspect.outcome == 'failure' || steps.visual.outcome == 'failure'
        run: exit 1
