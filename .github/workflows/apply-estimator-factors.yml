name: Hammer Brick - Apply Estimator Factors

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify the Pages CMS action
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        shell: bash
        run: |
          set -euo pipefail
          ACTION_NAME="$(printf '%s' "$PAGES_CMS_PAYLOAD" | jq -r '.action.name // empty')"
          test "$ACTION_NAME" = "apply-estimator-factors"

      - name: Apply saved estimator factors
        run: python3 scripts/apply_estimator.py

      - name: Commit estimator update
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- estimator-advanced.js; then
            echo "Estimator factors are already current."
            exit 0
          fi

          git config user.name "Hammer Brick Admin"
          git config user.email "actions@users.noreply.github.com"
          git add estimator-advanced.js
          git commit -m "admin: apply estimator factors"
          git push
