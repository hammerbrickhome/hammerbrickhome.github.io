name: Hammer Brick - Full Website Check

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify the Pages CMS action
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        shell: bash
        run: |
          set -euo pipefail
          ACTION_NAME="$(printf '%s' "$PAGES_CMS_PAYLOAD" | jq -r '.action.name // empty')"
          test "$ACTION_NAME" = "run-full-site-check"

      - name: Run full website check
        run: python3 scripts/master_audit.py

      - name: Save the health report
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- admin-tools/master-audit.json; then
            echo "The health report is already current."
            exit 0
          fi

          git config user.name "Hammer Brick Admin"
          git config user.email "actions@users.noreply.github.com"
          git add admin-tools/master-audit.json
          git commit -m "admin: update full website health report"
          git push
