name: Hammer Brick - Full Website Check

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify the Pages CMS action
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        shell: bash
        run: |
          set -euo pipefail
          ACTION_NAME="$(printf '%s' "$PAGES_CMS_PAYLOAD" | jq -r '.action.name // empty')"
          test "$ACTION_NAME" = "run-full-site-check"

      - name: Run full website check
        run: |
          python3 scripts/master_audit.py
          python3 scripts/gallery_media_cleanup.py --mode scan
          python3 scripts/owner_dashboard.py

      - name: Save the health report
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- admin-tools/master-audit.json admin-tools/command-center.json admin-tools/seo-report.json admin-tools/unused-images-report.json; then
            echo "The health report is already current."
            exit 0
          fi

          git config user.name "Hammer Brick Admin"
          git config user.email "actions@users.noreply.github.com"
          git add admin-tools/master-audit.json admin-tools/command-center.json admin-tools/seo-report.json admin-tools/unused-images-report.json
          git commit -m "admin: refresh owner dashboard and full website reports"
          git push
