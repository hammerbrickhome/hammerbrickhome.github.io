# Hammer Brick & Home LLC — Pages CMS configuration
# Place this file at the ROOT of your GitHub repository.
# Pages CMS will use GitHub authentication; no PHP/database is required.

media:
  - name: project_images
    label: Project Photos
    input: images
    output: /images
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe
    commit:
      templates:
        create: "gallery: upload {filename}"
        update: "gallery: update {filename}"
        delete: "gallery: remove {filename}"
        rename: "gallery: rename {oldFilename} to {newFilename}"

settings:
  commit:
    identity: app
    templates:
      update: "gallery: update {path}"

content:
  - name: gallery
    label: "Project Gallery Manager"
    type: file
    path: gallery.json
    format: json
    fields:
      - name: homePairs
        label: "Homepage Before & After"
        type: object
        description: "Projects shown in the Before & After section on the homepage. Drag items to change their order."
        list:
          collapsible:
            collapsed: true
            summary: "{label} — #{index}"
        fields:
          - name: before
            label: "Before Photo"
            type: image
            required: false
            options:
              media: project_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: after
            label: "After Photo"
            type: image
            required: false
            options:
              media: project_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: label
            label: "Project Title"
            type: string
            required: true
            options:
              maxlength: 100
          - name: tags
            label: "Tags"
            type: string
            list: true
            required: false
            description: "Examples: masonry, exterior, stairs, granite, remodel"

      - name: galleryPairs
        label: "Full Gallery Before & After"
        type: object
        description: "Before/after projects used on the full gallery page."
        list:
          collapsible:
            collapsed: true
            summary: "{label} — #{index}"
        fields:
          - name: before
            label: "Before Photo"
            type: image
            required: false
            options:
              media: project_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: after
            label: "After Photo"
            type: image
            required: false
            options:
              media: project_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: label
            label: "Project Title"
            type: string
            required: true
            options:
              maxlength: 100
          - name: tags
            label: "Tags"
            type: string
            list: true
            required: false
            description: "Examples: masonry, exterior, stairs, granite, remodel"

      - name: galleryGrid
        label: "Gallery Photo Grid"
        type: object
        description: "Single finished-project photos shown in the gallery grid."
        list:
          collapsible:
            collapsed: true
            summary: "Photo #{index}"
        fields:
          - name: name
            label: "Photo"
            type: image
            required: true
            options:
              media: project_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: tags
            label: "Tags"
            type: string
            list: true
            required: false
            description: "Examples: interior, masonry, exterior, remodel"

  - name: unused_images_report
    label: "Unused Images Report"
    type: file
    path: admin-tools/unused-images-report.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: generatedAt
        label: "Last Scan"
        type: string
      - name: count
        label: "Unused Images Found"
        type: number
      - name: totalSize
        label: "Potential Space To Free"
        type: string
      - name: note
        label: "Safety Note"
        type: text
      - name: files
        label: "Review These Images"
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{image} — {size}"
        fields:
          - name: image
            label: "Image"
            type: image
            options:
              media: project_images
          - name: size
            label: "File Size"
            type: string
          - name: reason
            label: "Why It Is Listed"
            type: text


actions:
  - name: scan-unused-gallery-images
    label: "Scan Unused Images"
    workflow: gallery-image-cleanup.yml
    ref: current
    cancelable: false
    confirm:
      title: "Scan for unused images?"
      message: "This only creates a report. It does not delete any images."
      button: "Run Scan"

  - name: delete-verified-unused-images
    label: "Delete Verified Unused Images"
    workflow: gallery-image-cleanup.yml
    ref: current
    cancelable: false
    confirm:
      title: "Delete reviewed unused images?"
      message: "Only images from the latest scan report that are STILL unused will be deleted. Git history can be used to restore a deleted file if necessary."
      button: "Delete Verified Images"
